  <!-- Spines -->
  <circle cx="10" cy="12" r="0.5" fill="#F4A261"/>
  <circle cx="14" cy="13" r="0.5" fill="#E9C46A"/>
  <circle cx="12" cy="15" r="0.5" fill="#F4A261"/>
  <circle cx="11" cy="18" r="0.5" fill="#E9C46A"/>
  <circle cx="13" cy="17" r="0.5" fill="#F4A261"/>
  
  <!-- Pot -->
